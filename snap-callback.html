<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GTA6 Clip Uploader · Snapchat login</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; line-height: 1.6; color: #111; background: #fff; }
</style>
</head>
<body>
<h1>Almost done</h1>
<p id="msg">Sending you back to GTA6 Clip Uploader on your own computer…</p>
<script>
  // Snapchat only accepts https redirect URIs. This page passes the login result (code + state)
  // straight on to the desktop tool listening on the owner's own computer (127.0.0.1:8771).
  // Nothing is stored or sent anywhere else.
  (function () {
    var q = window.location.search;
    if (!q || (q.indexOf('code=') < 0 && q.indexOf('error=') < 0)) {
      document.getElementById('msg').textContent = 'Nothing to do here.';
      return;
    }
    window.location.replace('http://127.0.0.1:8771/' + q);
  })();
</script>
</body>
